<div class="founder-grid">
  <div class="card" *ngFor="let founder of founders">
    <div class="photo">
      <img [src]="founder.photoUrl" [alt]="founder.name" />
    </div>
    <div class="card-text">
      <h3>{{ founder.name }}</h3>
      <h4>{{ founder.title }}</h4>
      <p>{{ founder.bio }}</p>
      <br/><br />
      <p>{{ founder.message }}</p>
    </div>
  </div>
</div>
